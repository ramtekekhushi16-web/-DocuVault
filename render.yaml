services:
  - type: web
    name: docuvault-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docuvault-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: DOCUVAULT_ENCRYPTION_KEY
        sync: false
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "30"

databases:
  - name: docuvault-db
    plan: basic-256mb
    databaseName: docuvault
    user: docuvault
